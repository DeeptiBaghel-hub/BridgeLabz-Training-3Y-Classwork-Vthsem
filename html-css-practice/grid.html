<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background: white;
        }

        .logo {
            color: rgb(81, 4, 214);
        }

        .navbar ul {
            display: flex;
            list-style: none;
            gap: 30px;
        }

        .navbar a {
            color: rgb(214, 9, 9);
            text-decoration: none;
            font-size: 16px;
        }

        .navbar a:hover {
            color: #00bcd4;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
        }

        .card {
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            background: white;
            transition: 0.3s;
        }
        .card:hover {
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        transform: translateY(-5px);
        }

        @media (max-width: 768px) {
        .grid {
            grid-template-columns: 1fr;
        }
        }
        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 10px;
            }

        @keyframes cardAnimation {
            from{
                opacity:0;
                transform: translateY(30px);
            }
            to{
                opacity:0;
                transform: translateY(0px);
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <h2 class="logo">My Website</h2>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Services</a></li>
            <li><a href="#">Contact</a></li>
        </ul>
    </nav>
    <div class="grid">
        <div class="card">
            <img src="img1.jpg" alt="Card Image">
            <h3>Card 1</h3>
            <p>This is the first card.</p>
        </div>

        <div class="card">
            <img src="img2.jpg" alt="Card Image">
            <h3>Card 2</h3>
            <p>This is the second card.</p>
        </div>

        <div class="card">
            <img src="img3.jpg" alt="Card Image">
            <h3>Card 3</h3>
            <p>This is the third card.</p>
        </div>
        <div class="card">
            <img src="img1.jpg" alt="Card Image">
            <h3>Card 4</h3>
        </div>
        <div class="card">
            <img src="img2.jpg" alt="Card Image">
            <h3>Card 5</h3>
        </div>
        <div class="card">
            <img src="img3.jpg" alt="Card Image">
            <h3>Card 6</h3>
        </div>
    </div>
</body>
</html>
