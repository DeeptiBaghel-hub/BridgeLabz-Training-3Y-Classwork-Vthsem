<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1 id="title">Welcome to DOM learning</h1>
    <p id="description">hello, world!</p>
    <button class="change-btn">Change heading</button>
    <h2>List of 3CA CRs</h2>
    <label for="cr-name">Enter CR name:</label>
    <input type="text" id="cr-name" placeholder="Enter CR name">
    <button id="add-btn">Add CR</button>
    <script>
        // document.getElementById("title").innerHTML="Welcome to DOM learning";
        // document.getElementById("description").innerHTML="hello, world!"; 
        // document.getElementsByClassName("title")[0].style.color="blue";  
        // document.querySelector("#description").style.fontSize="20px";


        const heading = document.querySelector("#title");
        const changeButton = document.querySelector(".change-btn");

        changeButton.addEventListener("click", function () {
            heading.textContent = "Heading is changed by a click event";
            heading.style.color = "red";
        });

        function addCrs(name) {
            const ul = document.querySelector("ul") || document.createElement("ul");
            const li = document.createElement("li");

            li.innerHTML = `${name}`;
            ul.appendChild(li);

            if (!ul.parentElement) {
                document.body.appendChild(ul);  
            }
        }

        const addCRButton = document.getElementById("add-btn");

        addCRButton.addEventListener('click', function () {
            const crName = document.getElementById("cr-name").value;

            if (crName.trim() !== "") {
                addCrs(crName);
                document.getElementById("cr-name").value = "";
            }
        });

        document.getElementById("cr-name").addEventListener('keydown', function (event) {
            if (event.key === 'Enter') {
                addCRButton.click();
            }
        });

        addCrs("John Doe");
        addCrs("Jane Smith");
        addCrs("Alice Johnson");

    </script>
</body>

</html>
